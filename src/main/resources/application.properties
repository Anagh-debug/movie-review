spring.application.name=eventspot-reviews
server.port=8080

# In-memory H2: no database server to install, schema rebuilt on every start.
spring.datasource.url=jdbc:h2:mem:eventspot;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql after Hibernate has created the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Browse the tables at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:eventspot)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.eventhosting=INFO
