# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Expects a PostgreSQL 16 database named eventspot to already exist.
spring.datasource.url=jdbc:postgresql://localhost:5432/eventspot
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seed data is for the throwaway H2 database only.
spring.sql.init.mode=never

spring.h2.console.enabled=false
